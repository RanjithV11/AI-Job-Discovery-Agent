[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-search-agent"
version = "0.1.0"
description = "Search Adzuna jobs and rank candidate fit with Groq."
requires-python = ">=3.10"
dependencies = ["groq>=0.15.0", "python-dotenv>=1.0.1", "requests>=2.32.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
job-agent = "job_search_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

